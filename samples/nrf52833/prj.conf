# tinyfota sample: receive a signed delta patch over Bluetooth (SMP, and with
# native.conf also the L2CAP CoC and the native GATT service) or the serial
# cable, stage it, and reboot into MCUboot, which applies it in place.
# sysbuild/mcuboot.conf is the bootloader half.

# ---- signing ------------------------------------------------------------------
# In single-slot mode MCUboot's own trailer does not depend on the sector count,
# so imgtool's swap-status reservation is space nothing uses. See pm_static.yml.
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--max-sectors 1"

# ---- the receiver ---------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_TINYFOTA_RECEIVER=y
# SMP over GATT, what tinyfota push and the browser page speak. It selects
# CONFIG_TINYFOTA_SMP_IMG, which also serves SMP over uart0 below.
CONFIG_TINYFOTA_BLE_SMP=y
CONFIG_TINYFOTA_LOG_LEVEL_INF=y

# The receiver's Kconfig depends on SETTINGS, as the source's did.
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# The header signature is checked here, in software: the nRF52833 has no crypto
# accelerator, so this is mbedTLS behind PSA on upstream Zephyr, and Oberon on
# NCS (CONFIG_NRF_SECURITY, which only NCS defines, is set in sysbuild.cmake).
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=1024
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# ---- Bluetooth ------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="tinyfota"

# TWO SLOTS, ONE OF THEM FOR UPDATES. With one connection slot a board that is
# doing its job -- a phone connected -- stops advertising and is invisible to
# every updater (ultrawidelock commit 91bf7f0f, measured over SWD there).
# src/main.c refuses to build with fewer than two, and restarts advertising
# while a slot is free.
CONFIG_BT_MAX_CONN=2

# The native L2CAP CoC and GATT service are in native.conf
# (-DEXTRA_CONF_FILE=native.conf); no shipped client uses them.
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# ---- mcumgr: SMP over Bluetooth and over uart0 ------------------------------------
# What nRF Device Manager, `mcumgr` and `tinyfota push` speak. Zephyr's own
# img_mgmt cannot be built in single-slot mode; CONFIG_TINYFOTA_SMP_IMG serves
# group 1 instead and forwards every byte to the receiver.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# Hands an unpaired peer the SMP endpoint; the update window and the reset gate
# (ports/zephyr/dfu_smp_img.c) are what stand in front of it.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=2048
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=n
CONFIG_MCUMGR_GRP_OS_INFO=n
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=n
CONFIG_BASE64=y
# Zephyr v4.4 turned UART_MCUMGR from something the transport selects into
# something it depends on, and without this line upstream drops the transport
# with only a Kconfig warning. On NCS v3.3.0 the transport still selects it.
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_UART_MTU=512

# ---- console on RTT, so uart0 carries SMP -----------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# ---- the update button, its LED, and the recovery gesture -------------------------
# Both default to n in the module, because sw0 normally belongs to the
# application; this sample has nothing else on it.
CONFIG_TINYFOTA_BUTTON=y
CONFIG_TINYFOTA_RECOVERY_GESTURE=y
CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
