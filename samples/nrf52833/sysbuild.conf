# MCUboot as image 0: a recovery floor and the delta applier, not a two-slot
# update system.
#
# One internal 512 KB flash means there is room for exactly ONE slot. That rules
# out atomic rollback, which needs a second slot to stage into. Accepted
# deliberately: what this buys is that a board with a corrupt or absent
# application still comes up in a bootloader that will take a new one over the
# J-Link OB's VCOM, with no probe and no external hardware, and that every
# other update is a delta the bootloader applies in place.
#
# NOTHING HERE MAY SET APPROTECT. Not SB_CONFIG_APPROTECT_LOCK, not
# SB_CONFIG_SECURE_APPROTECT_LOCK, and not the CONFIG_NRF_*APPROTECT_LOCK pair
# on any image. The lock re-asserts in SystemInit() on every boot and the only
# way out is `nrfjprog --recover`, which mass-erases flash AND UICR -- taking
# settings_storage with it. NCS defaults to open; leaving it alone is the whole
# requirement.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y

# ECDSA-P256 rather than ED25519. MCUboot's ED25519 is hash-then-sign over
# SHA-512, so it pulls in a second hash implementation and pays flash for it;
# P-256 verifies over the SHA-256 that the image hash already requires. It is
# also the curve the application checks a patch header with.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
