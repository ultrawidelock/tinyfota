# MCUboot for the tinyfota sample (nRF52833 DK, DWM3001CDK): single slot, serial
# recovery on the J-Link VCOM, and the delta applier.
#
# THIS FILE IS A FRAGMENT, AND THE FILENAME IS THE REASON IT IS ONE.
# sysbuild reads `<app>/sysbuild/<image>.conf` as EXTRA_CONF_FILE, merged ON TOP
# of MCUboot's own boot/zephyr/prj.conf
# (zephyr/share/sysbuild/cmake/modules/sysbuild_extensions.cmake:276-286).
# A DIRECTORY at `<app>/sysbuild/mcuboot/` means something else entirely: it
# becomes mcuboot_APPLICATION_CONFIG_DIR (same file, lines 267-271), and
# APPLICATION_CONFIG_DIR is where Zephyr looks up prj.conf and boards/
# (zephyr/cmake/modules/configuration_files.cmake:40-42). So a
# `sysbuild/mcuboot/prj.conf` REPLACES the upstream prj.conf instead of adding
# to it, and silently drops every baseline in it -- including
# CONFIG_MAIN_STACK_SIZE=10240, against a Zephyr default of 1024
# (zephyr/kernel/Kconfig:157-161). The ECDSA-P256 verify runs on that stack.
# Do not turn this file into that directory.

# ---- one slot -------------------------------------------------------------
# In ultrawidelock the app was 444,548 B of a 516,096 B slot (measured there).
# There is no second slot to stage
# into, so an upload overwrites the running image in place and a failed upload
# leaves no application at all. That is the trade this whole config makes: no
# rollback, but no state a bootloader cannot recover from either.
CONFIG_SINGLE_APPLICATION_SLOT=y

# ---- recovery transport ---------------------------------------------------
# uart0 is the J-Link OB's VCOM and it is bidirectional -- confirmed on a
# DWM3001CDK in ultrawidelock, in both directions (PSELRXD=15, PSELTXD=19,
# 115200, ERRORSRC showing OVERRUN only). So serial recovery rides the cable that is already attached, and the
# board pays none of the 16-22 KB that a CDC-ACM recovery console would cost.
# The sample consoles over RTT (CONFIG_UART_CONSOLE=n in prj.conf) and serves
# SMP on uart0 itself, so the same cable reaches the application and, when it
# does not run, MCUboot.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# NOT optional, and not a size trim. boot/zephyr/serial_adapter.c:28-32 is a
# hard #error whenever BOOT_SERIAL_UART is on, UART_CONSOLE is on, and
# zephyr,uart-mcumgr is either absent or the same node as zephyr,console. On
# both boards it is the same node -- decawave_dwm3001cdk.dts and
# nrf52833dk_nrf52833.dts choose zephyr,console, zephyr,shell-uart AND
# zephyr,uart-mcumgr all as &uart0 -- so
# MCUboot does not compile without this line. That the board already points
# zephyr,uart-mcumgr at uart0 is also why serial recovery needs no DTS overlay:
# serial_adapter.c:213-216 binds that chosen node in preference to the console.
CONFIG_UART_CONSOLE=n

# ---- what makes it a floor rather than a hope -----------------------------
# Verify slot 0 before jumping. Without this MCUboot checks the header and not
# the body, so an upload torn in the middle boots into whatever landed.
CONFIG_BOOT_VALIDATE_SLOT0=y

# Erase as the upload advances rather than all at once up front. The header is
# erased FIRST, so a cut during the body leaves an image that fails its own
# header check -- which is what turns a torn write into a clean recovery entry
# instead of a plausible-looking corrupt image.
CONFIG_BOOT_ERASE_PROGRESSIVELY=y

# No valid application -> stay in recovery instead of jumping into erased flash.
# This is the single line that makes the board unbrickable by a bad upload.
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# A valid image never waits for a host. The running application writes
# BOOT_MODE_TYPE_BOOTLOADER to GPREGRET2 only after the explicit recovery
# gesture, then warm-resets. MCUboot consumes and clears the byte before it
# enters serial recovery, so the request is one-shot.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n

# Defaults to y, and must not be: see above, sw0 is the update-window button.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# The image trailer's magic and flags are written in sub-word pieces, which the
# nRF flash driver cannot do natively.
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y

# ---- size ------------------------------------------------------------------
# MCUboot has to fit in front of an app that, in ultrawidelock, occupied 86% of
# flash. MEASURED in ultrawidelock, standalone, decawave_dwm3001cdk,
# ECDSA-P256, one lever at a time, before the applier was added:
#
#   this config without the two banner lines      31,152 B flash / 17,728 B RAM
#   + CONFIG_NCS_BOOT_BANNER=n only               31,068 B         17,728 B
#   + both banner lines (what is set below)       29,328 B         17,728 B
#   + LTO and ISR_TABLES_LOCAL_DECLARATION        26,848 B         17,600 B
#
CONFIG_PICOLIBC=y
CONFIG_CBPRINTF_NANO=y
CONFIG_LOG=n

# PRINTK=n DOES NOT WORK ON ITS OWN, and it fails silently -- Kconfig emits no
# warning, the line just loses. Two separate banners `select PRINTK`:
# nrf/lib/boot_banner/Kconfig:10 (NCS_BOOT_BANNER, default y) and
# zephyr/kernel/Kconfig:457-460 (BOOT_BANNER, also default y). MCUboot's own
# prj.conf turns NCS's on, which turns Zephyr's off -- so switching off only the
# NCS one hands the banner straight back to Zephyr and saves 84 B. Both have to
# go, and then PRINTK really is unset and it is worth 1,824 B. Verified by
# grepping the GENERATED .config for `# CONFIG_PRINTK is not set`, not by
# reading this file back.
# NCS_BOOT_BANNER exists only on NCS, so its `=n` is in ../sysbuild.cmake.
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# LTO IS DELIBERATELY OFF, and `CONFIG_LTO=y` alone would have been a no-op
# anyway: the symbol depends on
# `!(GEN_ISR_TABLES || GEN_IRQ_VECTOR_TABLE) || ISR_TABLES_LOCAL_DECLARATION`
# (zephyr/Kconfig.zephyr:526-528) and without that second symbol it is not even
# present in the generated .config -- again with no Kconfig warning. Turning
# both on builds and is worth a real 4,304 B.
#
# Declined because this image is the recovery floor. LTO is a whole-program
# codegen change in the one binary whose job is to still work when the
# application does not, and 29,328 B already fits the partition with ~20% spare,
# so the 4 KB buys nothing that is needed. Revisit only if MCUboot grows into
# its partition -- the measurement above is the receipt, and the two symbols
# that unlock it are named here so nobody has to rediscover the dependency.

# ---- the delta applier -----------------------------------------------------
# tinyfota's applier (core/dfu_applier.c) runs from a SYS_INIT at APPLICATION
# level in THIS image: after the flash driver is up, before MCUboot's main(),
# and without editing a line of MCUboot. The application half is
# CONFIG_TINYFOTA_RECEIVER in prj.conf; never both in one image. The README's
# size table has what it costs here.
CONFIG_TINYFOTA_APPLIER=y
